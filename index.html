<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MK Laundry Service</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">MK</div>
      <h1 class="login-business-name">MK Laundry Service</h1>
      <form id="login-form">
        <label>Username <input id="login-email" type="text" required></label>
        <label>Password <input id="login-password" type="password" required></label>
        <p id="login-error" class="error"></p>
        <button class="primary-button full-width" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark small">MK</span><strong class="business-name">MK Laundry Service</strong></div>
      <div class="user-card"><div class="avatar" id="user-avatar">A</div><div class="user-details"><strong id="user-name">Admin</strong><small id="user-role">Administrator</small></div><button id="password-button" class="profile-password-button employee-only" title="Change password">Change password</button></div>
      <nav>
        <button class="nav-item active" data-view="dashboard">▦ <span>Dashboard</span></button>
        <button class="nav-item" data-view="orders">▤ <span>Orders</span></button>
        <button class="nav-item employee-only" data-view="new-order">＋ <span>New order</span></button>
        <button class="nav-item admin-only" data-view="employees">♙ <span>Employees</span></button>
        <button class="nav-item admin-only" data-view="inventory">▥ <span>Inventory</span></button>
        <button class="nav-item admin-only" data-view="reports">▥ <span>Reports</span></button>
        <button class="nav-item admin-only" data-view="settings">⚙ <span>Settings</span></button>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><p class="eyebrow">OVERVIEW</p><h2 id="page-title">Dashboard</h2></div><div class="topbar-actions"><div class="date-label" id="today-label"></div><button id="logout-button" class="logout-button">↪ <span>Sign out</span></button></div></header>
      <div id="toast" class="toast"></div>
      <section id="view-dashboard" class="view"></section>
      <section id="view-orders" class="view hidden"></section>
      <section id="view-new-order" class="view hidden"></section>
      <section id="view-password" class="view hidden"></section>
      <section id="view-employees" class="view hidden"></section>
      <section id="view-inventory" class="view hidden"></section>
      <section id="view-reports" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
